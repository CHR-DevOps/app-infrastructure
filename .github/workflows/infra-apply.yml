name: Infra Apply

on:
  workflow_dispatch:

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_github_username: ${{ secrets.GIT_USERNAME }}
      TF_VAR_ghcr_token: ${{ secrets.GHCR_TOKEN_ARGOCD }}
      TF_VAR_git_branch: ${{ github.ref_name }}
      TF_VAR_key_name: ${{ secrets.AWS_EC2_KEY_NAME }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=chr-devops-terraform-s3-state" \
            -backend-config="key=app-infrastructure/prod/terraform.tfstate" \
            -backend-config="region=eu-central-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Apply
        run: terraform apply -auto-approve
