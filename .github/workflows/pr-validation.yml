name: PR Validation

on:
  pull_request:
    branches:
      - main
      - release
      - 'release/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend branch if exists, else main
        shell: bash
        run: |
          git clone https://github.com/CHR-DevOps/app-frontend.git app-frontend
          cd app-frontend
          git fetch origin

          if git ls-remote --heads origin "${{ github.head_ref }}" | grep -q "${{ github.head_ref }}"; then
            git checkout "${{ github.head_ref }}"
          else
            git checkout main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app-frontend

      - name: Run frontend lint
        run: npm run lint
        working-directory: app-frontend

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend branch if exists, else main
        shell: bash
        run: |
          git clone https://github.com/CHR-DevOps/app-backend.git app-backend
          cd app-backend
          git fetch origin

          if git ls-remote --heads origin "${{ github.head_ref }}" | grep -q "${{ github.head_ref }}"; then
            git checkout "${{ github.head_ref }}"
          else
            git checkout main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: app-backend

      - name: Run backend lint
        run: npm run lint
        working-directory: app-backend

  frontend-unit:
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - name: Checkout frontend branch if exists, else main
        shell: bash
        run: |
          git clone https://github.com/CHR-DevOps/app-frontend.git app-frontend
          cd app-frontend
          git fetch origin

          if git ls-remote --heads origin "${{ github.head_ref }}" | grep -q "${{ github.head_ref }}"; then
            git checkout "${{ github.head_ref }}"
          else
            git checkout main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app-frontend

      - name: Run frontend unit tests
        run: npm test
        working-directory: app-frontend

      - name: Build frontend
        run: npm run build
        working-directory: app-frontend

  backend-unit:
    runs-on: ubuntu-latest
    needs: backend-lint
    steps:
      - name: Checkout backend branch if exists, else main
        shell: bash
        run: |
          git clone https://github.com/CHR-DevOps/app-backend.git app-backend
          cd app-backend
          git fetch origin

          if git ls-remote --heads origin "${{ github.head_ref }}" | grep -q "${{ github.head_ref }}"; then
            git checkout "${{ github.head_ref }}"
          else
            git checkout main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app-backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: app-backend

      - name: Run backend unit tests
        run: npm test
        working-directory: app-backend

  comment-on-failure:
    runs-on: ubuntu-latest
    needs:
      - frontend-lint
      - backend-lint
      - frontend-unit
      - backend-unit
    if: ${{ failure() && github.event_name == 'pull_request' }}
    steps:
      - name: Comment on failed validation
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                'PR validation failed.',
                '',
                `Workflow run: ${runUrl}`,
                'Please review the frontend or backend validation logs, then push a fix before merging.'
              ].join('\n')
            });
