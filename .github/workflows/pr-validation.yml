name: PR Validation

on:
  pull_request:
    branches:
      - main
      - release
      - 'release/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  terraform-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive 2>&1 | tee /tmp/fmt-output.txt

      - name: Terraform Validate
        run: |
          terraform init -backend=false 2>&1
          terraform validate 2>&1 | tee /tmp/validate-output.txt

      - name: Comment on lint failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const read = (p) => { try { return fs.readFileSync(p, 'utf8') } catch (e) { return '' } }
            const truncate = (s) => s.length > 2000 ? s.slice(0, 2000) + '\n...(truncated)' : s
            let fmtOut = read('/tmp/fmt-output.txt')
            let valOut = read('/tmp/validate-output.txt')
            let body = `❌ **Terraform lint failed** on \`${{ github.sha }}\` — fix these before merging.\n`
            if (fmtOut) body += `\n**Format:**\n\`\`\`\n${truncate(fmtOut)}\n\`\`\`\n`
            if (valOut) body += `\n**Validate:**\n\`\`\`\n${truncate(valOut)}\n\`\`\`\n`
            body += `\n[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

  yaml-lint:
    runs-on: ubuntu-latest
    needs: terraform-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint Kubernetes manifests and workflows
        run: yamllint kubernetes/ .github/workflows/ 2>&1 | tee /tmp/yaml-output.txt

      - name: Comment on lint failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            let output = ''
            try { output = fs.readFileSync('/tmp/yaml-output.txt', 'utf8') } catch (e) {}
            if (output.length > 3000) output = output.slice(0, 3000) + '\n...(truncated)'
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `❌ **YAML lint failed** on \`${{ github.sha }}\`.\n\n\`\`\`\n${output}\n\`\`\`\n\n[View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            })
