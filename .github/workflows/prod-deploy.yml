name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: 'Infrastructure/app branch to deploy to production'
        required: true
        default: 'main'
        type: string
      image_tag:
        description: 'Image tag to promote to prod'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: write

jobs:
  update-prod-manifests:
    runs-on: ubuntu-latest
    outputs:
      deploy_branch: ${{ steps.set-vars.outputs.deploy_branch }}

    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_branch }}

      - name: Set variables
        id: set-vars
        run: |
          echo "deploy_branch=${{ github.event.inputs.deploy_branch }}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV

      - name: Update backend prod image tag
        run: |
          sed -i "s|image: .*app-backend:.*|image: ghcr.io/chr-devops/app-backend:${IMAGE_TAG}|g" kubernetes/prod/backend/deployment.yaml

      - name: Update frontend prod image tag
        run: |
          sed -i "s|image: .*app-frontend:.*|image: ghcr.io/chr-devops/app-frontend:${IMAGE_TAG}|g" kubernetes/prod/frontend/deployment.yaml

      - name: Commit updated prod manifests
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add kubernetes/prod/backend/deployment.yaml kubernetes/prod/frontend/deployment.yaml
          git diff --cached --quiet || git commit -m "Promote prod images to tag ${IMAGE_TAG}"

      - name: Push changes
        run: |
          git push origin HEAD:${{ github.event.inputs.deploy_branch }}

  point-prod-argocd-to-branch:
    runs-on: ubuntu-latest
    needs: update-prod-manifests
    outputs:
      prod_ip: ${{ steps.prod-ip.outputs.ip }}

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get prod public IP
        id: prod-ip
        shell: bash
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=prod*" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].PublicIpAddress" \
            --output text | head -n 1)

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "Could not find production instance public IP"
            exit 1
          fi

          echo "ip=$IP" >> $GITHUB_OUTPUT
          echo "PROD_IP=$IP" >> $GITHUB_ENV

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/prod.pem
          chmod 600 ~/.ssh/prod.pem

      - name: Patch prod Argo CD app to selected branch
        shell: bash
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -i ~/.ssh/prod.pem \
            ubuntu@${{ steps.prod-ip.outputs.ip }} <<EOF
          set -e

          sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n argocd patch application prod-app \
            --type merge \
            -p '{
              "spec":{
                "source":{
                  "targetRevision":"${{ needs.update-prod-manifests.outputs.deploy_branch }}"
                }
              }
            }'

          sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n argocd annotate application prod-app \
            deploy-ts="$(date +%s)" --overwrite
          EOF

  smoke-test-and-promote:
    runs-on: ubuntu-latest
    needs: point-prod-argocd-to-branch

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/prod.pem
          chmod 600 ~/.ssh/prod.pem

      - name: Wait for frontend
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS "http://${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }}/" >/dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            echo "Waiting for frontend..."
            sleep 10
          done

          echo "Frontend did not become ready in time"
          exit 1

      - name: Wait for backend
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS "http://${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }}/api/health" >/dev/null; then
              echo "Backend is up"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 10
          done

          echo "Backend did not become ready in time"
          exit 1

      - name: Preview services failed smoke tests
        shell: bash
        run: |
          set -e

          curl -f "http://${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }}/"
          curl -f "http://${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }}/api/health"

      - name: Promote backend rollout
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/prod.pem ubuntu@${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }} <<'EOF'
            set -euo pipefail
            sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl argo rollouts promote backend -n prod
            sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl argo rollouts status backend -n prod --timeout 180s
          EOF

      - name: Promote frontend rollout
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/prod.pem ubuntu@${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }} <<'EOF'
            set -euo pipefail
            sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl argo rollouts promote frontend -n prod
            sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl argo rollouts status frontend -n prod --timeout 180s
          EOF

      - name: Monitor production for 10 minutes
        run: |
          FAILS=0

          for i in {1..20}; do
            if ! curl -fsS "http://${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }}/" >/dev/null; then
              FAILS=$((FAILS+1))
            fi

            if ! curl -fsS "http://${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }}/api/health" >/dev/null; then
              FAILS=$((FAILS+1))
            fi

            echo "Health check round $i done"
            sleep 30
          done

          if [ "$FAILS" -gt 2 ]; then
            echo "Production monitoring detected too many failures: $FAILS"
            exit 1
          fi

          echo "Production looks healthy"