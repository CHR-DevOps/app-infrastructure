name: Production Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Infrastructure/app branch to deploy to production
        required: true
        default: main
      image_tag:
        description: Immutable image tag from a successful staging deploy
        required: true
        default: ""
      argo_app:
        description: Argo CD production app to update
        required: true
        default: prod-app

permissions:
  contents: write

jobs:
  update-prod-manifests:
    runs-on: ubuntu-latest
    outputs:
      deploy_branch: ${{ steps.vars.outputs.deploy_branch }}

    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_branch }}

      - name: Set variables
        id: vars
        run: |
          echo "deploy_branch=${{ github.event.inputs.deploy_branch }}" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV

      - name: Install yq
        shell: bash
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update prod image tags
        shell: bash
        run: |
          yq -i '
            (.images[] | select(.name == "ghcr.io/chr-devops/app-backend") | .newTag)
            = strenv(IMAGE_TAG)
          ' kubernetes/prod/kustomization.yaml

          yq -i '
            (.images[] | select(.name == "ghcr.io/chr-devops/app-frontend") | .newTag)
            = strenv(IMAGE_TAG)
          ' kubernetes/prod/kustomization.yaml

      - name: Commit updated prod manifests
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add kubernetes/prod/kustomization.yaml
          git diff --cached --quiet || git commit -m "Promote prod images to tag ${IMAGE_TAG}"

      - name: Push changes
        run: |
          git push origin HEAD:${{ github.event.inputs.deploy_branch }}

  point-prod-argocd-to-branch:
    runs-on: ubuntu-latest
    needs: update-prod-manifests
    outputs:
      prod_ip: ${{ steps.prod-ip.outputs.ip }}

    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Get prod public IP
        id: prod-ip
        run: |
          IP=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=k8s-prod" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "Found prod IP: $IP"

          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "Production instance not found or has no public IP"
            exit 1
          fi

          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Prepare SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEV_STAGING_EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/prod.pem
          chmod 600 ~/.ssh/prod.pem

          for i in {1..30}; do
            if ssh-keyscan -T 10 -H ${{ steps.prod-ip.outputs.ip }} >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "SSH ready"
              exit 0
            fi
            sleep 10
          done

          exit 1

      - name: Wait for SSH login
        shell: bash
        run: |
          for i in {1..30}; do
            if ssh \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              -i ~/.ssh/prod.pem \
              ubuntu@${{ steps.prod-ip.outputs.ip }} \
              'echo ok' >/dev/null 2>&1; then
              echo "OK"
              exit 0
            fi
            sleep 10
          done

          exit 1

      - name: Patch prod ArgoCD
        shell: bash
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/prod.pem \
            ubuntu@${{ steps.prod-ip.outputs.ip }} <<EOF
          set -e

          sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n argocd patch application ${{ github.event.inputs.argo_app }} \
            --type merge \
            -p '{
              "spec":{
                "source":{
                  "targetRevision":"${{ needs.update-prod-manifests.outputs.deploy_branch }}"
                }
              }
            }'

          sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl -n argocd annotate application ${{ github.event.inputs.argo_app }} \
            deploy-ts="$(date +%s)" --overwrite
          EOF

  smoke-test-and-promote:
    runs-on: ubuntu-latest
    needs: point-prod-argocd-to-branch

    steps:
      - name: Prepare SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEV_STAGING_EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/prod.pem
          chmod 600 ~/.ssh/prod.pem

          for i in {1..30}; do
            if ssh-keyscan -T 10 -H ${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }} >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "SSH ready"
              exit 0
            fi
            sleep 10
          done

          exit 1

      - name: Wait frontend
        run: |
          for i in {1..60}; do
            if curl -fsS "http://${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }}/" >/dev/null; then
              echo "Frontend is up"
              exit 0
            fi
            sleep 10
          done
          echo "Frontend did not become ready in time"
          exit 1

      - name: Wait backend
        run: |
          for i in {1..60}; do
            if curl -fsS "http://${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }}/api/health" >/dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 10
          done
          echo "Backend did not become ready in time"
          exit 1

      - name: Check preview rollout readiness
        shell: bash
        run: |
          ssh \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/prod.pem \
            ubuntu@${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }} <<'EOF'
          set -euo pipefail

          KUBECTL="sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl"

          wait_for_preview_ready() {
            service_name="$1"
            app_name="$2"

            for i in {1..60}; do
              endpoints=$($KUBECTL -n prod get endpoints "$service_name" \
                -o jsonpath='{range .subsets[*].addresses[*]}{.ip}{" "}{end}' 2>/dev/null || true)

              if [ -n "$endpoints" ]; then
                echo "$service_name ready endpoints: $endpoints"
                return 0
              fi

              sleep 5
            done

            echo "Preview rollout for $app_name did not become ready"
            $KUBECTL -n prod get rollout "$app_name" -o wide || true
            $KUBECTL -n prod describe rollout "$app_name" || true
            $KUBECTL -n prod get svc "$service_name" -o wide || true
            $KUBECTL -n prod get endpoints "$service_name" -o yaml || true
            $KUBECTL -n prod get pods -l app="$app_name" -o wide || true
            for pod in $($KUBECTL -n prod get pods -l app="$app_name" -o jsonpath='{range .items[*]}{.metadata.name}{" "}{end}' 2>/dev/null || true); do
              echo "--- describe pod: $pod ---"
              $KUBECTL -n prod describe pod "$pod" || true
            done
            exit 1
          }

          wait_for_preview_ready backend-preview backend
          wait_for_preview_ready frontend-preview frontend
          EOF

      - name: Smoke test preview services
        shell: bash
        run: |
          ssh \
            -o BatchMode=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/prod.pem \
            ubuntu@${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }} <<'EOF'
          set -euo pipefail

          KUBECTL="sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl"
          BACKEND_PF_PID=""
          FRONTEND_PF_PID=""

          cleanup() {
            if [ -n "$BACKEND_PF_PID" ]; then
              kill "$BACKEND_PF_PID" >/dev/null 2>&1 || true
              wait "$BACKEND_PF_PID" 2>/dev/null || true
            fi

            if [ -n "$FRONTEND_PF_PID" ]; then
              kill "$FRONTEND_PF_PID" >/dev/null 2>&1 || true
              wait "$FRONTEND_PF_PID" 2>/dev/null || true
            fi
          }

          trap cleanup EXIT

          wait_for_endpoints() {
            service_name="$1"

            for i in {1..60}; do
              endpoints=$($KUBECTL -n prod get endpoints "$service_name" \
                -o jsonpath='{range .subsets[*].addresses[*]}{.ip}{" "}{end}' 2>/dev/null || true)

              if [ -n "$endpoints" ]; then
                echo "$service_name endpoints: $endpoints"
                return 0
              fi

              sleep 5
            done

            echo "No ready endpoints found for $service_name"
            $KUBECTL -n prod get svc "$service_name" -o wide || true
            $KUBECTL -n prod get endpoints "$service_name" -o yaml || true
            $KUBECTL -n prod get pods -o wide || true
            return 1
          }

          wait_for_port_forward() {
            url="$1"
            log_file="$2"

            for i in {1..30}; do
              if curl -fsS "$url" >/dev/null; then
                return 0
              fi
              sleep 5
            done

            echo "Port-forward never became ready for $url"
            cat "$log_file" || true
            return 1
          }

          wait_for_endpoints backend-preview
          nohup bash -lc "$KUBECTL -n prod port-forward svc/backend-preview 5001:5000" \
            >/tmp/backend-preview-port-forward.log 2>&1 </dev/null &
          BACKEND_PF_PID=$!
          wait_for_port_forward http://127.0.0.1:5001/api/health /tmp/backend-preview-port-forward.log

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5001/api/health | grep -q '"status":"ok"'; then
              echo "Preview backend health check passed"
              break
            fi
            sleep 5
          done

          curl -fsS http://127.0.0.1:5001/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:5001/api/data | grep -q '^\['

          wait_for_endpoints frontend-preview
          nohup bash -lc "$KUBECTL -n prod port-forward svc/frontend-preview 3001:3000" \
            >/tmp/frontend-preview-port-forward.log 2>&1 </dev/null &
          FRONTEND_PF_PID=$!
          wait_for_port_forward http://127.0.0.1:3001/ /tmp/frontend-preview-port-forward.log

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/ | grep -q 'Data List'; then
              echo "Preview frontend smoke check passed"
              break
            fi
            sleep 5
          done

          curl -fsS http://127.0.0.1:3001/ | grep -q 'Data List'
          EOF

      - name: Promote backend rollout
        shell: bash
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/prod.pem \
            ubuntu@${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }} <<'EOF'
          sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl argo rollouts promote backend -n prod
          sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl argo rollouts status backend -n prod --timeout 180s
          EOF

      - name: Promote frontend rollout
        shell: bash
        run: |
          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/prod.pem \
            ubuntu@${{ needs.point-prod-argocd-to-branch.outputs.prod_ip }} <<'EOF'
          sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl argo rollouts promote frontend -n prod
          sudo KUBECONFIG=/etc/rancher/k3s/k3s.yaml kubectl argo rollouts status frontend -n prod --timeout 180s
          EOF
