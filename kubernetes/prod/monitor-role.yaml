apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prod-health-monitor
  namespace: prod
rules:
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - patch
